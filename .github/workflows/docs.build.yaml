name: Build and Publish Documentation Docker Image

on:
  push:
    branches:
      - "main"
    paths:
      - "docs/**"
      - "README.md"
  pull_request:
    branches:
      - "main"
    paths:
      - "docs/**"
      - "README.md"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/docs

defaults:
  run:
    working-directory: docs/
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Extract version
        id: version
        run: |
          # Goal: produce a semantic version 'X.0.0' so image tag becomes 'docs-vX.0.0'.
          # The major version is bumped automatically on each docs build.
          # 1) Look for the latest git tag matching 'docs-vX.Y.Z' pattern.
          # 2) Bump the major version (X) by 1, reset minor and patch to 0.
          # 3) If no tags found, start at 1.0.0.

          set -euo pipefail

          git fetch --tags --quiet

          # Find the latest semantic version tag for docs
          LATEST_DOCS_TAG=$(git tag --list --sort=-v:refname 'docs-v*' | grep -E '^docs-v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)

          if [ -n "$LATEST_DOCS_TAG" ]; then
            # Extract the version without 'docs-v' prefix
            CURRENT_VERSION=${LATEST_DOCS_TAG#docs-v}
            # Extract major version number
            MAJOR=$(echo "$CURRENT_VERSION" | cut -d. -f1)
            # Bump major version
            NEW_MAJOR=$((MAJOR + 1))
            VERSION="${NEW_MAJOR}.0.0"
          else
            # No docs-v semantic version tags found: start at 1.0.0
            VERSION="1.0.0"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected docs version: $VERSION"

      # Install the cosign tool except on PR
      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v4.0.0

      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v5.0.0
        with:
          # The `defaults: run: working-directory` does not apply to actions.
          # Set the build context and Dockerfile path relative to the repository root
          context: .
          file: ./config/mkdocs/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Create and push a git tag for the docs release (only on non-PR runs)
      - name: Create and push git tag
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          TAG_REF=docs-v${{ steps.version.outputs.version }}
          echo "Creating tag $TAG_REF"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Annotated tag with message
          git tag -a "$TAG_REF" -m "Docs release $TAG_REF"
          # Push the tag using the repository's origin (actions/checkout set this up)
          git push origin "$TAG_REF"

      # Sign the resulting Docker image digest except on PRs.
      # This will only write to the public Rekor transparency log when the Docker
      # repository is public to avoid leaking data.  If you would like to publish
      # transparency data even for private images, pass --force to cosign below.
      # https://github.com/sigstore/cosign
      - name: Sign the published Docker image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          # https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-an-intermediate-environment-variable
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        # This step uses the identity token to provision an ephemeral certificate
        # against the sigstore community Fulcio instance.
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}

  deploy-pages:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pngquant

      - name: Install MkDocs and dependencies
        run: pip install --no-cache-dir mkdocs-material mkdocs-pdf

      - name: Build documentation
        run: mkdocs build --config-file config/mkdocs/mkdocs.yml

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
